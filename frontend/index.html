<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Venue Reservation Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Flatpickr Core CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

 <style>
    /* =========================================================
       ROOT VARIABLES
    ========================================================= */

    :root {
        --primary: #3b82f6;
        --primary-hover: #2563eb;

        --glass-bg: rgba(255, 255, 255, 0.12);
        --glass-border: rgba(255, 255, 255, 0.25);
        --glass-card: rgba(15, 23, 42, 0.72);

        --text-light: #ffffff;
        --text-dim: #cbd5e1;

        --radius-lg: 20px;
        --radius-md: 10px;
    }


    /* =========================================================
       GLOBAL RESET
    ========================================================= */

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
    }


    html {
        width: 100%;
        min-height: 100%;
        scroll-behavior: smooth;
    }


    body {
        width: 100%;
        min-height: 100vh;

        display: flex;
        flex-direction: column;

        overflow-x: hidden;

        color: var(--text-light);

        background:
            radial-gradient(
                circle at center,
                rgba(15, 23, 42, 0.45) 0%,
                rgba(15, 23, 42, 0.85) 100%
            ),
            url('college-bg.jpeg')
            no-repeat
            center center
            fixed;

        background-size: cover;
        background-position: center top;

        -webkit-font-smoothing: antialiased;
    }


    /* =========================================================
       NAVBAR
    ========================================================= */

    .navbar {
        width: 100%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 20px;

        padding: 14px 40px;

        position: sticky;
        top: 0;
        z-index: 50;

        background:
            rgba(15, 23, 42, 0.60);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        border-bottom:
            1px solid var(--glass-border);
    }


    .navbar-brand {
        display: flex;
        align-items: center;

        gap: 14px;

        min-width: 0;
    }


    .college-logo {
        height: 44px;
        width: auto;

        max-width: 140px;

        object-fit: contain;

        flex-shrink: 0;

        filter:
            drop-shadow(
                0 2px 4px rgba(0, 0, 0, 0.2)
            );
    }


    .brand-text {
        min-width: 0;
    }


    .brand-text h1 {
        color: #ffffff;

        font-size: 18px;
        font-weight: 800;

        letter-spacing: 0.3px;
        line-height: 1.25;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }


    .brand-text p {
        margin-top: 3px;

        color: #93c5fd;

        font-size: 12px;
        font-weight: 500;

        line-height: 1.3;
    }


    /* =========================================================
       NAVBAR ACTIONS
    ========================================================= */

    .navbar-actions {
        display: flex;
        align-items: center;

        gap: 16px;

        flex-shrink: 0;
    }


    .naac-badge {
        height: 40px;
        width: auto;

        object-fit: contain;

        background:
            rgba(255, 255, 255, 0.10);

        padding: 3px 8px;

        border-radius: 8px;

        border:
            1px solid
            rgba(255, 255, 255, 0.20);

        backdrop-filter: blur(6px);

        transition:
            transform 0.2s ease,
            border-color 0.2s ease;
    }


    .naac-badge:hover {
        transform: translateY(-1px);

        border-color:
            rgba(255, 255, 255, 0.40);
    }


    .admin-link {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        min-height: 40px;

        padding: 8px 18px;

        background:
            rgba(255, 255, 255, 0.10);

        color: #ffffff;

        border:
            1px solid var(--glass-border);

        border-radius:
            var(--radius-md);

        text-decoration: none;

        font-size: 13px;
        font-weight: 600;

        white-space: nowrap;

        backdrop-filter: blur(8px);

        transition:
            background 0.2s ease,
            border-color 0.2s ease,
            transform 0.2s ease;
    }


    .admin-link:hover {
        background: var(--primary);

        border-color: var(--primary);

        transform: translateY(-1px);
    }


    /* =========================================================
       MAIN CONTAINER
    ========================================================= */

    .main-container {
        width: 100%;

        max-width: 820px;

        margin: 40px auto;

        padding: 0 20px;
    }


    /* =========================================================
       GLASS CARD
    ========================================================= */

    .glass-card {
        width: 100%;

        background:
            var(--glass-card);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border-radius:
            var(--radius-lg);

        border:
            1px solid var(--glass-border);

        box-shadow:
            0 25px 50px -12px
            rgba(0, 0, 0, 0.5);

        padding: 38px 44px;
    }


    /* =========================================================
       CARD HEADER
    ========================================================= */

    .card-header {
        margin-bottom: 26px;

        padding-bottom: 16px;

        border-bottom:
            1px solid
            rgba(255, 255, 255, 0.15);
    }


    .card-header h2 {
        color: #ffffff;

        font-size: 22px;
        font-weight: 700;

        line-height: 1.3;
    }


    .card-header p {
        color: var(--text-dim);

        font-size: 13px;

        margin-top: 4px;

        line-height: 1.5;
    }


    /* =========================================================
       FORM GRID
    ========================================================= */

    .form-grid {
        width: 100%;

        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 20px;

        margin-bottom: 20px;
    }


    .form-group {
        min-width: 0;

        display: flex;
        flex-direction: column;
    }


    .form-group-full {
        width: 100%;

        display: flex;
        flex-direction: column;

        margin-bottom: 20px;
    }


    /* =========================================================
       LABELS
    ========================================================= */

    label {
        margin-bottom: 6px;

        color: #93c5fd;

        font-size: 12px;
        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: 0.6px;

        line-height: 1.3;
    }


    /* =========================================================
       INPUTS
    ========================================================= */

    input[type="text"],
    input[type="email"],
    select,
    textarea,
    .flatpickr-input,
    .flatpickr-input.form-control {

        width: 100% !important;

        min-width: 0;
        min-height: 48px;

        padding: 12px 16px !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.20)
            !important;

        border-radius:
            var(--radius-md)
            !important;

        font-size: 14px !important;

        color: #ffffff !important;

        background:
            rgba(255, 255, 255, 0.08)
            !important;

        backdrop-filter: blur(6px) !important;

        outline: none !important;

        transition:
            border-color 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;
    }


    ::placeholder {
        color:
            rgba(203, 213, 225, 0.60)
            !important;
    }


    select {
        cursor: pointer;
    }


    select option {
        background: #0f172a;
        color: #ffffff;
    }


    input[type="text"]:focus,
    input[type="email"]:focus,
    select:focus,
    textarea:focus,
    .flatpickr-input:focus,
    .flatpickr-input.form-control:focus {

        border-color:
            #60a5fa !important;

        background:
            rgba(255, 255, 255, 0.15)
            !important;

        box-shadow:
            0 0 0 3px
            rgba(96, 165, 250, 0.25)
            !important;
    }


    textarea {
        resize: vertical;

        min-height: 85px;
    }


    /* =========================================================
       SUBMIT BUTTON
    ========================================================= */

    .submit-btn {

        width: 100%;

        min-height: 52px;

        padding: 15px;

        margin-top: 8px;

        border:
            1px solid
            rgba(255, 255, 255, 0.20);

        border-radius:
            var(--radius-md);

        color: #ffffff;

        background:
            linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

        font-size: 15px;

        font-weight: 700;

        cursor: pointer;

        box-shadow:
            0 4px 15px
            rgba(37, 99, 235, 0.40);

        transition:
            all 0.2s ease;
    }


    .submit-btn:hover {

        background:
            linear-gradient(
                135deg,
                #3b82f6,
                #2563eb
            );

        box-shadow:
            0 6px 20px
            rgba(59, 130, 246, 0.60);

        transform:
            translateY(-1px);
    }


    .submit-btn:disabled {

        background:
            #475569;

        box-shadow:
            none;

        cursor:
            not-allowed;

        transform:
            none;
    }


    /* =========================================================
       ALERTS
    ========================================================= */

    .alert {

        width: 100%;

        padding: 14px 18px;

        margin-bottom: 24px;

        display: none;

        border-radius:
            var(--radius-md);

        font-size: 14px;

        line-height: 1.5;

        backdrop-filter:
            blur(10px);

        overflow-wrap:
            anywhere;
    }


    .alert-error {

        background-color:
            rgba(239, 68, 68, 0.20);

        color:
            #fca5a5;

        border:
            1px solid
            rgba(239, 68, 68, 0.40);
    }


    .alert-success {

        background-color:
            rgba(34, 197, 94, 0.20);

        color:
            #86efac;

        border:
            1px solid
            rgba(34, 197, 94, 0.40);
    }


    /* =========================================================
       FLATPICKR CALENDAR
    ========================================================= */

    .flatpickr-calendar {

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif !important;

        background:
            #0f172a !important;

        border-radius:
            18px !important;

        box-shadow:
            0 25px 50px -12px
            rgba(0, 0, 0, 0.70),

            0 0 0 1px
            rgba(255, 255, 255, 0.15)
            !important;

        border:
            none !important;

        padding:
            16px !important;

        width:
            340px !important;

        max-width:
            calc(100vw - 20px) !important;

        height:
            auto !important;
    }


    /* =========================================================
       FLATPICKR MONTH HEADER
    ========================================================= */

    .flatpickr-months {

        display:
            flex !important;

        align-items:
            center !important;

        height:
            38px !important;

        position:
            relative !important;

        margin-bottom:
            8px !important;
    }


    .flatpickr-months
    .flatpickr-month {

        height:
            100% !important;

        color:
            #ffffff !important;

        background:
            transparent !important;
    }


    /* =========================================================
       MONTH SELECTOR
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-current-month {

        display:
            flex !important;

        align-items:
            center !important;

        justify-content:
            center !important;

        width:
            100% !important;

        padding:
            0 !important;

        font-size:
            15px !important;

        font-weight:
            700 !important;

        color:
            #ffffff !important;
    }


    .flatpickr-calendar
    .flatpickr-current-month
    .flatpickr-monthDropdown-months {

        background:
            #273146 !important;

        color:
            #ffffff !important;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif !important;

        font-size:
            15px !important;

        font-weight:
            700 !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.20)
            !important;

        border-radius:
            6px !important;

        outline:
            none !important;

        cursor:
            pointer !important;

        padding:
            6px 10px !important;
    }


    /* =========================================================
       MONTH DROPDOWN OPTIONS
       
       IMPORTANT:
       Native browser dropdown is white.
       Therefore the option text is BLACK.
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-current-month
    .flatpickr-monthDropdown-months
    option {

        background-color:
            #ffffff !important;

        color:
            #000000 !important;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif !important;

        font-size:
            14px !important;

        font-weight:
            600 !important;

        padding:
            8px !important;
    }


    /* Selected month option */

    .flatpickr-calendar
    .flatpickr-current-month
    .flatpickr-monthDropdown-months
    option:checked {

        background-color:
            #dbeafe !important;

        color:
            #000000 !important;

        font-weight:
            700 !important;
    }


    /* =========================================================
       YEAR
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-current-month
    .numInputWrapper {

        margin-left:
            6px !important;
    }


    .flatpickr-calendar
    .flatpickr-current-month
    .numInputWrapper
    input.cur-year {

        color:
            #ffffff !important;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif !important;

        font-size:
            15px !important;

        font-weight:
            700 !important;

        background:
            transparent !important;

        border:
            none !important;

        outline:
            none !important;

        box-shadow:
            none !important;
    }


    /* =========================================================
       MONTH NAVIGATION BUTTONS
    ========================================================= */

    .flatpickr-months
    .flatpickr-prev-month,
    .flatpickr-months
    .flatpickr-next-month {

        padding:
            8px !important;

        height:
            32px !important;

        width:
            32px !important;

        border-radius:
            8px !important;

        background:
            rgba(255, 255, 255, 0.08)
            !important;

        display:
            flex !important;

        align-items:
            center !important;

        justify-content:
            center !important;

        top:
            3px !important;

        transition:
            background 0.15s ease !important;
    }


    .flatpickr-months
    .flatpickr-prev-month:hover,
    .flatpickr-months
    .flatpickr-next-month:hover {

        background:
            rgba(59, 130, 246, 0.20)
            !important;
    }


    .flatpickr-months
    .flatpickr-prev-month svg,
    .flatpickr-months
    .flatpickr-next-month svg {

        fill:
            #60a5fa !important;

        width:
            12px !important;

        height:
            12px !important;
    }


    /* =========================================================
       REMOVE WEEKDAY HEADER COMPLETELY
       
       NO:
       Sun Mon Tue Wed Thu Fri Sat
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-weekdays,

    .flatpickr-calendar
    .flatpickr-weekdaycontainer,

    .flatpickr-calendar
    span.flatpickr-weekday {

        display:
            none !important;

        height:
            0 !important;

        min-height:
            0 !important;

        max-height:
            0 !important;

        margin:
            0 !important;

        padding:
            0 !important;

        visibility:
            hidden !important;
    }


    /* =========================================================
       DAYS CONTAINER
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-days {

        width:
            100% !important;

        max-width:
            100% !important;

        margin:
            0 !important;

        padding:
            0 !important;
    }


    .flatpickr-calendar
    .dayContainer {

        width:
            100% !important;

        min-width:
            100% !important;

        max-width:
            100% !important;

        display:
            grid !important;

        grid-template-columns:
            repeat(7, minmax(0, 1fr))
            !important;

        row-gap:
            4px !important;

        column-gap:
            2px !important;

        padding:
            0 !important;
    }


    /* =========================================================
       DATE CELLS
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-day {

        color:
            #cbd5e1 !important;

        background:
            transparent !important;

        border-radius:
            10px !important;

        height:
            36px !important;

        width:
            36px !important;

        max-width:
            36px !important;

        line-height:
            36px !important;

        margin:
            auto !important;

        font-size:
            13px !important;

        font-weight:
            500 !important;

        border:
            1px solid
            transparent !important;

        transition:
            all 0.15s ease !important;
    }


    .flatpickr-calendar
    .flatpickr-day:hover {

        background:
            rgba(255, 255, 255, 0.12)
            !important;

        color:
            #ffffff !important;
    }


    .flatpickr-calendar
    .flatpickr-day.selected {

        background:
            #2563eb !important;

        border-color:
            #3b82f6 !important;

        color:
            #ffffff !important;

        font-weight:
            700 !important;

        box-shadow:
            0 0 10px
            rgba(37, 99, 235, 0.60)
            !important;
    }


    .flatpickr-calendar
    .flatpickr-day.today {

        border-color:
            #60a5fa !important;

        color:
            #ffffff !important;
    }


    .flatpickr-calendar
    .flatpickr-day.flatpickr-disabled,
    .flatpickr-calendar
    .flatpickr-day.flatpickr-disabled:hover {

        color:
            rgba(255, 255, 255, 0.18)
            !important;

        background:
            transparent !important;

        cursor:
            not-allowed !important;
    }


    /* =========================================================
       TIME PICKER
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-time {

        background:
            rgba(255, 255, 255, 0.05)
            !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.12)
            !important;

        border-radius:
            12px !important;

        height:
            48px !important;

        line-height:
            48px !important;

        margin-top:
            8px !important;

        padding:
            4px 8px !important;

        display:
            flex !important;

        align-items:
            center !important;

        justify-content:
            center !important;

        gap:
            6px !important;
    }


    .flatpickr-calendar
    .flatpickr-time input {

        color:
            #ffffff !important;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif !important;

        font-size:
            15px !important;

        font-weight:
            700 !important;

        border-radius:
            8px !important;

        background:
            rgba(255, 255, 255, 0.08)
            !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.10)
            !important;

        height:
            34px !important;

        padding:
            0 !important;
    }


    .flatpickr-calendar
    .flatpickr-time input:focus {

        border-color:
            #60a5fa !important;

        background:
            rgba(255, 255, 255, 0.16)
            !important;
    }


    .flatpickr-calendar
    .flatpickr-time
    .flatpickr-time-separator {

        color:
            #94a3b8 !important;

        font-weight:
            700 !important;
    }


    .flatpickr-calendar
    .flatpickr-time
    .flatpickr-am-pm {

        color:
            #ffffff !important;

        background:
            #2563eb !important;

        border-radius:
            8px !important;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif !important;

        font-size:
            13px !important;

        font-weight:
            700 !important;

        height:
            34px !important;

        line-height:
            34px !important;

        padding:
            0 14px !important;

        cursor:
            pointer !important;

        transition:
            background 0.15s ease !important;
    }


    .flatpickr-calendar
    .flatpickr-time
    .flatpickr-am-pm:hover {

        background:
            #1d4ed8 !important;
    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 1023px) {

        .navbar {

            padding:
                14px 24px;
        }


        .main-container {

            max-width:
                760px;
        }


        .glass-card {

            padding:
                30px 28px;
        }
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 767px) {

        body {

            background-attachment:
                scroll;
        }


        .navbar {

            padding:
                12px 14px;

            gap:
                10px;
        }


        .navbar-brand {

            gap:
                10px;
        }


        .college-logo {

            height:
                40px;

            max-width:
                90px;
        }


        .brand-text h1 {

            font-size:
                clamp(
                    12px,
                    3.5vw,
                    15px
                );

            white-space:
                normal;
        }


        .brand-text p {

            font-size:
                9px;
        }


        .navbar-actions {

            gap:
                7px;
        }


        .naac-badge {

            height:
                34px;

            max-width:
                65px;

            padding:
                2px 5px;
        }


        .admin-link {

            min-height:
                36px;

            padding:
                7px 10px;

            font-size:
                11px;
        }


        .main-container {

            margin:
                20px auto 28px;

            padding:
                0 12px;
        }


        .glass-card {

            padding:
                22px 16px;

            border-radius:
                17px;
        }


        .card-header {

            margin-bottom:
                22px;

            padding-bottom:
                14px;
        }


        .form-grid {

            grid-template-columns:
                1fr;

            gap:
                16px;

            margin-bottom:
                16px;
        }


        .form-group-full {

            margin-bottom:
                16px;
        }


        input[type="text"],
        input[type="email"],
        select,
        textarea,
        .flatpickr-input,
        .flatpickr-input.form-control {

            min-height:
                50px;

            padding:
                13px 14px !important;

            font-size:
                16px !important;
        }


        textarea {

            min-height:
                105px;
        }


        .submit-btn {

            min-height:
                54px;

            font-size:
                14px;
        }


        /* ---------------------------------------------
           MOBILE CALENDAR
        --------------------------------------------- */

        .flatpickr-calendar {

            width:
                calc(100vw - 20px)
                !important;

            max-width:
                calc(100vw - 20px)
                !important;

            padding:

        .flatpickr-current-month
        .flatpickr-monthDropdown-months {

        .flatpickr-calendar
        .flatpickr-current-month
        .flatpickr-monthDropdown-months
        option {

        }

<body>

    <header class="navbar">
        <div class="navbar-brand">
            <img src="college-logo.png" alt="College Logo" class="college-logo" onerror="this.style.display='none'">
            <div class="brand-text">
                <h1>Campus Venue Reservation</h1>
                <p>Institutional Slot Booking Portal</p>
            </div>
        </div>

        <!-- Right Side Actions: NAAC Badge + Admin Button -->
        <div class="navbar-actions">
            <img src="naac-logo.png" alt="NAAC A++ Accredited" class="naac-badge" title="NAAC A++ Accredited"
                onerror="this.style.display='none'">
            <a href="admin.html" class="admin-link">Admin Portal &rarr;</a>
        </div>
    </header>

    <main class="main-container">
        <div class="glass-card">
            <div class="card-header">
                <h2>Reserve a Venue</h2>
                <p>Select venue and timing. Collision detection prevents overlapping bookings.</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="bookingForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="faculty_name">Faculty Name</label>
                        <input type="text" id="faculty_name" placeholder="Prof. Alan Turing" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Official Mail ID</label>
                        <input type="email" id="email" placeholder="faculty@institution.edu" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="venue">Booking Venue</label>
                        <select id="venue" required>
                            <option value="Seminar Hall">Seminar Hall</option>
                            <option value="Placement Hall">Placement Hall</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" placeholder="e.g. MCA, CSE, ECE" required>
                    </div>
                </div>

                <div class="form-group-full">
                    <label for="event_details">Event Details / Purpose</label>
                    <textarea id="event_details"
                        placeholder="Guest lecture topic, speaker name, or placement drive details..."
                        required></textarea>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="start_datetime">Event Start Date &amp; Time</label>
                        <input type="text" id="start_datetime" placeholder="Select start time" required>
                    </div>
                    <div class="form-group">
                        <label for="end_datetime">Event End Date &amp; Time</label>
                        <input type="text" id="end_datetime" placeholder="Select end time" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Confirm and Book Slot</button>
            </form>
        </div>
    </main>

    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        const API_BASE = "/api/v1";

        const fpConfig = {
            enableTime: true,
            dateFormat: "Y-m-dTH:i:S",
            altInput: true,
            altFormat: "d-m-Y h:i K",
            time_24hr: false,
            minuteIncrement: 15,
            minDate: "today"
        };

        flatpickr("#start_datetime", fpConfig);
        flatpickr("#end_datetime", fpConfig);

        const form = document.getElementById("bookingForm");
        const alertBox = document.getElementById("alertBox");
        const submitBtn = document.getElementById("submitBtn");

        function showAlert(message, isError = false) {
            alertBox.style.display = "block";
            alertBox.className = "alert " + (isError ? "alert-error" : "alert-success");
            alertBox.innerText = message;
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            alertBox.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.innerText = "Checking availability...";

            const startVal = document.getElementById("start_datetime").value;
            const endVal = document.getElementById("end_datetime").value;

            if (!startVal || !endVal) {
                showAlert("Please select both start and end dates/times.", true);
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
                return;
            }

            const startDateObj = new Date(startVal);
            const endDateObj = new Date(endVal);

            if (endDateObj <= startDateObj) {
                showAlert("Event end time must be after the start time.", true);
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
                return;
            }

            const payload = {
                faculty_name: document.getElementById("faculty_name").value.trim(),
                email: document.getElementById("email").value.trim(),
                venue: document.getElementById("venue").value,
                department: document.getElementById("department").value.trim(),
                event_details: document.getElementById("event_details").value.trim(),
                start_datetime: startVal,
                end_datetime: endVal
            };

            try {
                const res = await fetch(`${API_BASE}/bookings`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) {
                    let errorMsg = "Unable to reserve slot.";
                    if (typeof data.detail === "string") {
                        errorMsg = data.detail;
                    } else if (Array.isArray(data.detail) && data.detail.length > 0) {
                        errorMsg = data.detail.map(err => `${err.loc ? err.loc.slice(-1)[0] + ': ' : ''}${err.msg}`).join(", ");
                    }
                    throw new Error(errorMsg);
                }

                showAlert(`Booking Confirmed! Reference ID: ${data.booking_reference}. A confirmation email has been dispatched.`);
                form.reset();
            } catch (err) {
                showAlert(err.message || "Network error: Unable to connect to server.", true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
            }
        });
    </script>
</body>

</html>
