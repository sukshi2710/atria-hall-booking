<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Venue Reservation Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Flatpickr Core CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    :root {
        --primary: #3b82f6;
        --primary-hover: #2563eb;

        --text-light: #ffffff;
        --text-dim: #cbd5e1;

        --calendar-bg: #0f172a;
        --calendar-input-bg: #273146;

        --glass-border: rgba(255, 255, 255, 0.20);

        --radius-md: 10px;
        --radius-lg: 20px;
    }


    * {
        box-sizing: border-box;

        margin: 0;
        padding: 0;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
    }


    html {
        width: 100%;
        min-height: 100%;

        scroll-behavior: smooth;
    }


    body {
        width: 100%;
        min-height: 100vh;

        overflow-x: hidden;

        color: var(--text-light);

        background:
            radial-gradient(
                circle at center,
                rgba(15, 23, 42, 0.45),
                rgba(15, 23, 42, 0.90)
            ),
            url('college-bg.jpeg')
            no-repeat
            center center fixed;

        background-size: cover;
        background-position: center top;

        -webkit-font-smoothing: antialiased;
    }


    /* =========================================================
       NAVBAR
    ========================================================= */

    .navbar {
        width: 100%;

        display: flex;

        align-items: center;
        justify-content: space-between;

        gap: 20px;

        padding: 14px 40px;

        position: sticky;

        top: 0;

        z-index: 50;

        background:
            rgba(15, 23, 42, 0.60);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        border-bottom:
            1px solid
            rgba(255, 255, 255, 0.15);
    }


    .navbar-brand {
        display: flex;

        align-items: center;

        gap: 14px;

        min-width: 0;
    }


    .college-logo {
        height: 44px;

        width: auto;

        max-width: 140px;

        object-fit: contain;

        flex-shrink: 0;
    }


    .brand-text {
        min-width: 0;
    }


    .brand-text h1 {
        color: #ffffff;

        font-size: 18px;

        font-weight: 800;

        line-height: 1.25;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    .brand-text p {
        margin-top: 3px;

        color: #93c5fd;

        font-size: 12px;

        font-weight: 500;
    }


    .navbar-actions {
        display: flex;

        align-items: center;

        gap: 16px;

        flex-shrink: 0;
    }


    .naac-badge {
        height: 40px;

        width: auto;

        object-fit: contain;

        padding: 3px 8px;

        border-radius: 8px;

        background:
            rgba(255, 255, 255, 0.10);

        border:
            1px solid
            rgba(255, 255, 255, 0.20);
    }


    .admin-link {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        min-height: 40px;

        padding: 8px 18px;

        border-radius: var(--radius-md);

        color: #ffffff;

        background:
            rgba(255, 255, 255, 0.10);

        border:
            1px solid
            var(--glass-border);

        text-decoration: none;

        font-size: 13px;

        font-weight: 600;

        white-space: nowrap;

        transition:
            all 0.2s ease;
    }


    .admin-link:hover {
        background: var(--primary);

        border-color: var(--primary);

        transform: translateY(-1px);
    }


    /* =========================================================
       MAIN CONTAINER
    ========================================================= */

    .main-container {
        width: 100%;

        max-width: 820px;

        margin: 40px auto;

        padding: 0 20px;
    }


    /* =========================================================
       GLASS CARD
    ========================================================= */

    .glass-card {
        width: 100%;

        padding: 38px 44px;

        background:
            rgba(15, 23, 42, 0.72);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border:
            1px solid
            rgba(255, 255, 255, 0.20);

        border-radius:
            var(--radius-lg);

        box-shadow:
            0 25px 50px -12px
            rgba(0, 0, 0, 0.50);
    }


    /* =========================================================
       CARD HEADER
    ========================================================= */

    .card-header {
        margin-bottom: 26px;

        padding-bottom: 16px;

        border-bottom:
            1px solid
            rgba(255, 255, 255, 0.15);
    }


    .card-header h2 {
        color: #ffffff;

        font-size: 22px;

        font-weight: 700;

        line-height: 1.3;
    }


    .card-header p {
        margin-top: 4px;

        color: var(--text-dim);

        font-size: 13px;

        line-height: 1.5;
    }


    /* =========================================================
       FORM GRID
    ========================================================= */

    .form-grid {
        width: 100%;

        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 20px;

        margin-bottom: 20px;
    }


    .form-group {
        min-width: 0;

        display: flex;

        flex-direction: column;
    }


    .form-group-full {
        width: 100%;

        display: flex;

        flex-direction: column;

        margin-bottom: 20px;
    }


    /* =========================================================
       LABELS
    ========================================================= */

    label {
        margin-bottom: 6px;

        color: #93c5fd;

        font-size: 12px;

        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: 0.6px;
    }


    /* =========================================================
       FORM INPUTS
    ========================================================= */

    input[type="text"],
    input[type="email"],
    select,
    textarea,
    .flatpickr-input,
    .flatpickr-input.form-control {

        width: 100% !important;

        min-width: 0;

        min-height: 48px;

        padding:
            12px 16px !important;

        color: #ffffff !important;

        background:
            rgba(255, 255, 255, 0.08)
            !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.20)
            !important;

        border-radius:
            var(--radius-md)
            !important;

        outline: none !important;

        font-size: 14px !important;

        backdrop-filter: blur(6px);

        transition:
            border-color 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;
    }


    ::placeholder {
        color:
            rgba(203, 213, 225, 0.60)
            !important;
    }


    select {
        cursor: pointer;
    }


    select option {
        background: #0f172a;

        color: #ffffff;
    }


    input:focus,
    select:focus,
    textarea:focus,
    .flatpickr-input:focus {

        border-color:
            #60a5fa !important;

        background:
            rgba(255, 255, 255, 0.14)
            !important;

        box-shadow:
            0 0 0 3px
            rgba(96, 165, 250, 0.20)
            !important;
    }


    textarea {
        resize: vertical;

        min-height: 85px;
    }


    /* =========================================================
       BUTTON
    ========================================================= */

    .submit-btn {

        width: 100%;

        min-height: 52px;

        margin-top: 8px;

        padding: 15px;

        color: #ffffff;

        background:
            linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

        border:
            1px solid
            rgba(255, 255, 255, 0.20);

        border-radius:
            var(--radius-md);

        font-size: 15px;

        font-weight: 700;

        cursor: pointer;

        box-shadow:
            0 4px 15px
            rgba(37, 99, 235, 0.40);

        transition:
            all 0.2s ease;
    }


    .submit-btn:hover {

        transform:
            translateY(-1px);

        box-shadow:
            0 6px 20px
            rgba(59, 130, 246, 0.60);
    }


    .submit-btn:disabled {

        background: #475569;

        box-shadow: none;

        cursor: not-allowed;

        transform: none;
    }


    /* =========================================================
       ALERT
    ========================================================= */

    .alert {

        width: 100%;

        padding: 14px 18px;

        margin-bottom: 24px;

        display: none;

        border-radius:
            var(--radius-md);

        font-size: 14px;

        line-height: 1.5;
    }


    .alert-error {

        background:
            rgba(239, 68, 68, 0.20);

        color:
            #fca5a5;

        border:
            1px solid
            rgba(239, 68, 68, 0.40);
    }


    .alert-success {

        background:
            rgba(34, 197, 94, 0.20);

        color:
            #86efac;

        border:
            1px solid
            rgba(34, 197, 94, 0.40);
    }


    /* =========================================================
       FLATPICKR CALENDAR
    ========================================================= */

    .flatpickr-calendar {

        width: 340px !important;

        max-width:
            calc(100vw - 20px) !important;

        padding: 14px !important;

        background:
            var(--calendar-bg) !important;

        border: none !important;

        border-radius:
            18px !important;

        box-shadow:
            0 25px 50px -12px
            rgba(0, 0, 0, 0.70),

            0 0 0 1px
            rgba(255, 255, 255, 0.15)
            !important;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif !important;
    }


    /* =========================================================
       MONTH BAR
    ========================================================= */

    .flatpickr-calendar .flatpickr-months {

        width: 100% !important;

        height: 46px !important;

        display: flex !important;

        align-items: center !important;

        position: relative !important;

        margin-bottom: 6px !important;
    }


    .flatpickr-calendar .flatpickr-month {

        width: 100% !important;

        height: 46px !important;

        background: transparent !important;
    }


    /* =========================================================
       CURRENT MONTH HEADER
       
       IMPORTANT:
       This fixes the YEAR clipping issue.
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-current-month {

        position: absolute !important;

        left: 42px !important;

        right: 42px !important;

        top: 0 !important;

        width: auto !important;

        height: 46px !important;

        padding: 0 !important;

        display: flex !important;

        align-items: center !important;

        justify-content: center !important;

        gap: 8px !important;

        color: #ffffff !important;

        font-size: 15px !important;

        font-weight: 700 !important;

        white-space: nowrap !important;

        overflow: visible !important;
    }


    /* =========================================================
       MONTH DROPDOWN
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-current-month
    .flatpickr-monthDropdown-months {

        width: 150px !important;

        min-width: 150px !important;

        max-width: 150px !important;

        height: 42px !important;

        padding:
            0 30px 0 14px !important;

        margin: 0 !important;

        color: #ffffff !important;

        background:
            #273146 !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.20)
            !important;

        border-radius:
            6px !important;

        outline: none !important;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif !important;

        font-size: 15px !important;

        font-weight: 700 !important;

        cursor: pointer !important;

        appearance: auto !important;
    }


    /* =========================================================
       MONTH OPTIONS
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-current-month
    .flatpickr-monthDropdown-months
    option {

        background:
            #ffffff !important;

        color:
            #000000 !important;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif !important;

        font-size:
            14px !important;

        font-weight:
            600 !important;

        padding:
            8px !important;
    }


    /* Selected month */

    .flatpickr-calendar
    .flatpickr-current-month
    .flatpickr-monthDropdown-months
    option:checked {

        background:
            #dbeafe !important;

        color:
            #000000 !important;

        font-weight:
            700 !important;
    }


    /* =========================================================
       YEAR - FIXED
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-current-month
    .numInputWrapper {

        width: 58px !important;

        min-width: 58px !important;

        max-width: 58px !important;

        height: 42px !important;

        display: flex !important;

        align-items: center !important;

        justify-content: center !important;

        margin: 0 !important;

        padding: 0 !important;

        position: relative !important;

        overflow: visible !important;
    }


    .flatpickr-calendar
    .flatpickr-current-month
    input.cur-year {

        width: 58px !important;

        min-width: 58px !important;

        max-width: 58px !important;

        height: 42px !important;

        padding: 0 !important;

        margin: 0 !important;

        text-align: center !important;

        color:
            #ffffff !important;

        background:
            transparent !important;

        border: none !important;

        outline: none !important;

        box-shadow: none !important;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif !important;

        font-size:
            15px !important;

        font-weight:
            700 !important;

        opacity: 1 !important;

        -webkit-text-fill-color:
            #ffffff !important;
    }


    /* Hide year spinner arrows */

    .flatpickr-calendar
    .flatpickr-current-month
    .numInputWrapper
    span {

        display:
            none !important;
    }


    /* =========================================================
       PREVIOUS / NEXT BUTTONS
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-prev-month,

    .flatpickr-calendar
    .flatpickr-next-month {

        width:
            36px !important;

        height:
            36px !important;

        top:
            5px !important;

        padding:
            0 !important;

        display:
            flex !important;

        align-items:
            center !important;

        justify-content:
            center !important;

        border-radius:
            9px !important;

        background:
            rgba(255, 255, 255, 0.08)
            !important;

        z-index:
            10 !important;

        transition:
            background 0.2s ease !important;
    }


    .flatpickr-calendar
    .flatpickr-prev-month {

        left:
            0 !important;
    }


    .flatpickr-calendar
    .flatpickr-next-month {

        right:
            0 !important;
    }


    .flatpickr-calendar
    .flatpickr-prev-month:hover,

    .flatpickr-calendar
    .flatpickr-next-month:hover {

        background:
            rgba(59, 130, 246, 0.20)
            !important;
    }


    .flatpickr-calendar
    .flatpickr-prev-month svg,

    .flatpickr-calendar
    .flatpickr-next-month svg {

        width:
            13px !important;

        height:
            13px !important;

        fill:
            #60a5fa !important;
    }


    /* =========================================================
       REMOVE WEEKDAY HEADER
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-weekdays,

    .flatpickr-calendar
    .flatpickr-weekdaycontainer,

    .flatpickr-calendar
    span.flatpickr-weekday {

        display:
            none !important;

        visibility:
            hidden !important;

        height:
            0 !important;

        min-height:
            0 !important;

        max-height:
            0 !important;

        margin:
            0 !important;

        padding:
            0 !important;
    }


    /* =========================================================
       DAYS
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-days {

        width:
            100% !important;

        max-width:
            100% !important;

        margin:
            0 !important;

        padding:
            0 !important;
    }


    .flatpickr-calendar
    .dayContainer {

        width:
            100% !important;

        min-width:
            100% !important;

        max-width:
            100% !important;

        display:
            grid !important;

        grid-template-columns:
            repeat(
                7,
                minmax(0, 1fr)
            ) !important;

        gap:
            4px 2px !important;

        padding:
            0 !important;
    }


    /* =========================================================
       DAY CELLS
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-day {

        width:
            36px !important;

        max-width:
            36px !important;

        height:
            36px !important;

        line-height:
            36px !important;

        margin:
            auto !important;

        color:
            #cbd5e1 !important;

        background:
            transparent !important;

        border:
            1px solid
            transparent !important;

        border-radius:
            10px !important;

        font-size:
            13px !important;

        font-weight:
            500 !important;

        transition:
            all 0.15s ease !important;
    }


    .flatpickr-calendar
    .flatpickr-day:hover {

        color:
            #ffffff !important;

        background:
            rgba(255, 255, 255, 0.12)
            !important;
    }


    .flatpickr-calendar
    .flatpickr-day.selected {

        color:
            #ffffff !important;

        background:
            #2563eb !important;

        border-color:
            #3b82f6 !important;

        font-weight:
            700 !important;

        box-shadow:
            0 0 10px
            rgba(37, 99, 235, 0.55)
            !important;
    }


    .flatpickr-calendar
    .flatpickr-day.today {

        color:
            #ffffff !important;

        border-color:
            #60a5fa !important;
    }


    .flatpickr-calendar
    .flatpickr-day.flatpickr-disabled {

        color:
            rgba(255, 255, 255, 0.18)
            !important;

        background:
            transparent !important;
    }


    /* =========================================================
       TIME PICKER
    ========================================================= */

    .flatpickr-calendar
    .flatpickr-time {

        height:
            48px !important;

        margin-top:
            8px !important;

        padding:
            4px 8px !important;

        display:
            flex !important;

        align-items:
            center !important;

        justify-content:
            center !important;

        gap:
            6px !important;

        background:
            rgba(255, 255, 255, 0.05)
            !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.12)
            !important;

        border-radius:
            12px !important;
    }


    .flatpickr-calendar
    .flatpickr-time input {

        height:
            34px !important;

        color:
            #ffffff !important;

        background:
            rgba(255, 255, 255, 0.08)
            !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.10)
            !important;

        border-radius:
            8px !important;

        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif !important;

        font-size:
            15px !important;

        font-weight:
            700 !important;

        text-align:
            center !important;
    }


    .flatpickr-calendar
    .flatpickr-time input:focus {

        border-color:
            #60a5fa !important;

        background:
            rgba(255, 255, 255, 0.16)
            !important;
    }


    .flatpickr-calendar
    .flatpickr-time
    .flatpickr-time-separator {

        color:
            #94a3b8 !important;

        font-weight:
            700 !important;
    }


    .flatpickr-calendar
    .flatpickr-time
    .flatpickr-am-pm {

        height:
            34px !important;

        line-height:
            34px !important;

        padding:
            0 14px !important;

        color:
            #ffffff !important;

        background:
            #2563eb !important;

        border-radius:
            8px !important;

        font-size:
            13px !important;

        font-weight:
            700 !important;

        cursor:
            pointer !important;
    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 1023px) {

        .navbar {

            padding:
                14px 24px;
        }


        .main-container {

            max-width:
                760px;
        }


        .glass-card {

            padding:
                30px 28px;
        }
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 767px) {

        body {

            background-attachment:
                scroll;
        }


        .navbar {

            padding:
                12px 14px;

            gap:
                10px;
        }


        .college-logo {

            height:
                40px;

            max-width:
                90px;
        }


        .brand-text h1 {

            font-size:
                clamp(
                    12px,
                    3.5vw,
                    15px
                );

            white-space:
                normal;
        }


        .brand-text p {

            font-size:
                9px;
        }


        .navbar-actions {

            gap:
                7px;
        }


        .naac-badge {

            height:
                34px;

            max-width:
                65px;
        }


        .admin-link {

            min-height:
                36px;

            padding:
                7px 10px;

            font-size:
                11px;
        }


        .main-container {

            margin:
                20px auto 28px;

            padding:
                0 12px;
        }


        .glass-card {

            padding:
                22px 16px;

            border-radius:
                17px;
        }


        .form-grid {

            grid-template-columns:
                1fr;

            gap:
                16px;
        }


        input[type="text"],
        input[type="email"],
        select,
        textarea,
        .flatpickr-input,
        .flatpickr-input.form-control {

            min-height:
                50px;

            font-size:
                16px !important;
        }


        /* ---------------------------------------------
           MOBILE CALENDAR
        --------------------------------------------- */

        .flatpickr-calendar {

            width:
                calc(100vw - 20px)
                !important;

            max-width:
                calc(100vw - 20px)
                !important;

            padding:
                10px !important;

            border-radius:
                15px !important;
        }


        .flatpickr-calendar
        .flatpickr-months {

            height:
                44px !important;
        }


        .flatpickr-calendar
        .flatpickr-month {

            height:
                44px !important;
        }


        .flatpickr-calendar
        .flatpickr-current-month {

            left:
                40px !important;

            right:
                40px !important;

            height:
                44px !important;

            gap:
                5px !important;
        }


        .flatpickr-calendar
        .flatpickr-current-month
        .flatpickr-monthDropdown-months {

            width:
                125px !important;

            min-width:
                125px !important;

            max-width:
                125px !important;

            height:
                38px !important;

            padding:
                0 25px 0 10px !important;

            font-size:
                13px !important;
        }


        .flatpickr-calendar
        .flatpickr-current-month
        .numInputWrapper {

            width:
                50px !important;

            min-width:
                50px !important;

            max-width:

<body>

    <header class="navbar">
        <div class="navbar-brand">
            <img src="college-logo.png" alt="College Logo" class="college-logo" onerror="this.style.display='none'">
            <div class="brand-text">
                <h1>Campus Venue Reservation</h1>
                <p>Institutional Slot Booking Portal</p>
            </div>
        </div>

        <!-- Right Side Actions: NAAC Badge + Admin Button -->
        <div class="navbar-actions">
            <img src="naac-logo.png" alt="NAAC A++ Accredited" class="naac-badge" title="NAAC A++ Accredited"
                onerror="this.style.display='none'">
            <a href="admin.html" class="admin-link">Admin Portal &rarr;</a>
        </div>
    </header>

    <main class="main-container">
        <div class="glass-card">
            <div class="card-header">
                <h2>Reserve a Venue</h2>
                <p>Select venue and timing. Collision detection prevents overlapping bookings.</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="bookingForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="faculty_name">Faculty Name</label>
                        <input type="text" id="faculty_name" placeholder="Prof. Alan Turing" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Official Mail ID</label>
                        <input type="email" id="email" placeholder="faculty@institution.edu" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="venue">Booking Venue</label>
                        <select id="venue" required>
                            <option value="Seminar Hall">Seminar Hall</option>
                            <option value="Placement Hall">Placement Hall</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" placeholder="e.g. MCA, CSE, ECE" required>
                    </div>
                </div>

                <div class="form-group-full">
                    <label for="event_details">Event Details / Purpose</label>
                    <textarea id="event_details"
                        placeholder="Guest lecture topic, speaker name, or placement drive details..."
                        required></textarea>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="start_datetime">Event Start Date &amp; Time</label>
                        <input type="text" id="start_datetime" placeholder="Select start time" required>
                    </div>
                    <div class="form-group">
                        <label for="end_datetime">Event End Date &amp; Time</label>
                        <input type="text" id="end_datetime" placeholder="Select end time" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Confirm and Book Slot</button>
            </form>
        </div>
    </main>

    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        const API_BASE = "/api/v1";

        const fpConfig = {
            enableTime: true,
            dateFormat: "Y-m-dTH:i:S",
            altInput: true,
            altFormat: "d-m-Y h:i K",
            time_24hr: false,
            minuteIncrement: 15,
            minDate: "today"
        };

        flatpickr("#start_datetime", fpConfig);
        flatpickr("#end_datetime", fpConfig);

        const form = document.getElementById("bookingForm");
        const alertBox = document.getElementById("alertBox");
        const submitBtn = document.getElementById("submitBtn");

        function showAlert(message, isError = false) {
            alertBox.style.display = "block";
            alertBox.className = "alert " + (isError ? "alert-error" : "alert-success");
            alertBox.innerText = message;
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            alertBox.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.innerText = "Checking availability...";

            const startVal = document.getElementById("start_datetime").value;
            const endVal = document.getElementById("end_datetime").value;

            if (!startVal || !endVal) {
                showAlert("Please select both start and end dates/times.", true);
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
                return;
            }

            const startDateObj = new Date(startVal);
            const endDateObj = new Date(endVal);

            if (endDateObj <= startDateObj) {
                showAlert("Event end time must be after the start time.", true);
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
                return;
            }

            const payload = {
                faculty_name: document.getElementById("faculty_name").value.trim(),
                email: document.getElementById("email").value.trim(),
                venue: document.getElementById("venue").value,
                department: document.getElementById("department").value.trim(),
                event_details: document.getElementById("event_details").value.trim(),
                start_datetime: startVal,
                end_datetime: endVal
            };

            try {
                const res = await fetch(`${API_BASE}/bookings`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) {
                    let errorMsg = "Unable to reserve slot.";
                    if (typeof data.detail === "string") {
                        errorMsg = data.detail;
                    } else if (Array.isArray(data.detail) && data.detail.length > 0) {
                        errorMsg = data.detail.map(err => `${err.loc ? err.loc.slice(-1)[0] + ': ' : ''}${err.msg}`).join(", ");
                    }
                    throw new Error(errorMsg);
                }

                showAlert(`Booking Confirmed! Reference ID: ${data.booking_reference}. A confirmation email has been dispatched.`);
                form.reset();
            } catch (err) {
                showAlert(err.message || "Network error: Unable to connect to server.", true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
            }
        });
    </script>
</body>

</html>
