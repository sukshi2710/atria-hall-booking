<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Venue Reservation Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Flatpickr Core CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

   <style>
    /* =========================================================
       RESPONSIVE CAMPUS VENUE RESERVATION UI
       Mobile → Tablet → Laptop → Desktop
    ========================================================= */

    :root {
        --primary: #3b82f6;
        --primary-hover: #2563eb;

        --glass-bg: rgba(255, 255, 255, 0.12);
        --glass-border: rgba(255, 255, 255, 0.25);
        --glass-card: rgba(15, 23, 42, 0.68);

        --text-light: #ffffff;
        --text-dim: #cbd5e1;

        --radius-lg: 20px;
        --radius-md: 10px;

        --content-width: 820px;
    }


    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
            'Plus Jakarta Sans',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
    }


    html {
        width: 100%;
        min-height: 100%;
        scroll-behavior: smooth;
    }


    body {
        width: 100%;
        min-height: 100vh;

        display: flex;
        flex-direction: column;

        overflow-x: hidden;

        color: var(--text-light);

        background:
            radial-gradient(
                circle at center,
                rgba(15, 23, 42, 0.45) 0%,
                rgba(15, 23, 42, 0.85) 100%
            ),
            url('college-bg.jpeg')
            no-repeat
            center center;

        background-size: cover;
        background-position: center top;
        background-attachment: fixed;

        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }


    /* =========================================================
       NAVBAR
    ========================================================= */

    .navbar {
        width: 100%;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 20px;

        padding:
            14px
            clamp(16px, 4vw, 40px);

        position: sticky;
        top: 0;
        z-index: 50;

        background: rgba(15, 23, 42, 0.64);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        border-bottom:
            1px solid
            var(--glass-border);
    }


    .navbar-brand {
        min-width: 0;

        display: flex;
        align-items: center;

        gap: 14px;
    }


    .college-logo {
        width: auto;
        height: 44px;
        max-width: 145px;

        flex-shrink: 0;

        object-fit: contain;

        filter:
            drop-shadow(
                0 2px 4px
                rgba(0, 0, 0, 0.2)
            );
    }


    .brand-text {
        min-width: 0;
    }


    .brand-text h1 {
        color: #ffffff;

        font-size:
            clamp(14px, 2vw, 18px);

        font-weight: 800;

        line-height: 1.2;

        letter-spacing: 0.3px;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }


    .brand-text p {
        margin-top: 4px;

        color: #93c5fd;

        font-size:
            clamp(9px, 1.5vw, 12px);

        font-weight: 500;

        line-height: 1.3;
    }


    /* =========================================================
       NAVBAR RIGHT SIDE
    ========================================================= */

    .navbar-actions {
        display: flex;
        align-items: center;

        gap: 12px;

        flex-shrink: 0;
    }


    .naac-badge {
        width: auto;
        height: 40px;

        max-width: 95px;

        padding: 3px 8px;

        object-fit: contain;

        background:
            rgba(255, 255, 255, 0.10);

        border:
            1px solid
            rgba(255, 255, 255, 0.20);

        border-radius: 8px;

        backdrop-filter: blur(6px);

        transition:
            transform 0.2s ease,
            border-color 0.2s ease;
    }


    .naac-badge:hover {
        transform: translateY(-1px);

        border-color:
            rgba(255, 255, 255, 0.40);
    }


    .admin-link {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        min-height: 40px;

        padding:
            8px
            16px;

        color: #ffffff;

        text-decoration: none;

        font-size: 13px;
        font-weight: 600;

        white-space: nowrap;

        background:
            rgba(255, 255, 255, 0.10);

        border:
            1px solid
            var(--glass-border);

        border-radius: var(--radius-md);

        backdrop-filter: blur(8px);

        transition:
            background 0.2s ease,
            border-color 0.2s ease,
            transform 0.2s ease;
    }


    .admin-link:hover {
        background: var(--primary);

        border-color:
            var(--primary);

        transform: translateY(-1px);
    }


    /* =========================================================
       MAIN CONTAINER
    ========================================================= */

    .main-container {
        width: 100%;
        max-width: var(--content-width);

        margin:
            clamp(24px, 5vw, 40px)
            auto;

        padding:
            0
            clamp(14px, 4vw, 20px);
    }


    /* =========================================================
       GLASS CARD
    ========================================================= */

    .glass-card {
        width: 100%;

        padding:
            clamp(20px, 4vw, 38px)
            clamp(16px, 5vw, 44px);

        background: var(--glass-card);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border:
            1px solid
            var(--glass-border);

        border-radius: var(--radius-lg);

        box-shadow:
            0 25px 50px -12px
            rgba(0, 0, 0, 0.5);
    }


    /* =========================================================
       CARD HEADER
    ========================================================= */

    .card-header {
        margin-bottom: 26px;

        padding-bottom: 16px;

        border-bottom:
            1px solid
            rgba(255, 255, 255, 0.15);
    }


    .card-header h2 {
        color: #ffffff;

        font-size:
            clamp(19px, 3vw, 22px);

        font-weight: 700;

        line-height: 1.3;
    }


    .card-header p {
        margin-top: 6px;

        color: var(--text-dim);

        font-size:
            clamp(11px, 2vw, 13px);

        line-height: 1.5;
    }


    /* =========================================================
       FORM GRID
    ========================================================= */

    .form-grid {
        width: 100%;

        display: grid;

        grid-template-columns:
            repeat(
                2,
                minmax(0, 1fr)
            );

        gap: 20px;

        margin-bottom: 20px;
    }


    .form-group {
        min-width: 0;

        display: flex;
        flex-direction: column;
    }


    .form-group-full {
        width: 100%;

        display: flex;
        flex-direction: column;

        margin-bottom: 20px;
    }


    /* =========================================================
       LABELS
    ========================================================= */

    label {
        margin-bottom: 7px;

        color: #93c5fd;

        font-size: 12px;
        font-weight: 700;

        line-height: 1.3;

        text-transform: uppercase;

        letter-spacing: 0.6px;
    }


    /* =========================================================
       INPUTS / SELECT / TEXTAREA
    ========================================================= */

    input[type="text"],
    input[type="email"],
    select,
    textarea,
    .flatpickr-input,
    .flatpickr-input.form-control {

        width: 100% !important;

        min-width: 0;

        min-height: 48px;

        padding:
            12px
            14px !important;

        color: #ffffff !important;

        background:
            rgba(255, 255, 255, 0.08) !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.20) !important;

        border-radius:
            var(--radius-md) !important;

        outline: none !important;

        font-size: 14px !important;

        line-height: 1.4;

        backdrop-filter: blur(6px);

        transition:
            border-color 0.2s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;
    }


    input[type="text"]:focus,
    input[type="email"]:focus,
    select:focus,
    textarea:focus,
    .flatpickr-input:focus,
    .flatpickr-input.form-control:focus {

        border-color:
            #60a5fa !important;

        background:
            rgba(255, 255, 255, 0.15) !important;

        box-shadow:
            0 0 0 3px
            rgba(96, 165, 250, 0.25)
            !important;
    }


    input[type="text"]:hover,
    input[type="email"]:hover,
    select:hover,
    textarea:hover {

        border-color:
            rgba(255, 255, 255, 0.35)
            !important;
    }


    ::placeholder {
        color:
            rgba(203, 213, 225, 0.60)
            !important;
    }


    select {
        cursor: pointer;
    }


    select option {
        background-color: #0f172a;

        color: #ffffff;
    }


    textarea {
        min-height: 100px;

        resize: vertical;
    }


    /* =========================================================
       SUBMIT BUTTON
    ========================================================= */

    .submit-btn {

        width: 100%;

        min-height: 52px;

        padding:
            13px
            18px;

        margin-top: 8px;

        border:
            1px solid
            rgba(255, 255, 255, 0.20);

        border-radius:
            var(--radius-md);

        color: #ffffff;

        background:
            linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

        font-size:
            clamp(13px, 2vw, 15px);

        font-weight: 700;

        cursor: pointer;

        box-shadow:
            0 4px 15px
            rgba(37, 99, 235, 0.40);

        transition:
            background 0.2s ease,
            box-shadow 0.2s ease,
            transform 0.2s ease;
    }


    .submit-btn:hover {
        background:
            linear-gradient(
                135deg,
                #3b82f6,
                #2563eb
            );

        box-shadow:
            0 6px 20px
            rgba(59, 130, 246, 0.60);

        transform:
            translateY(-1px);
    }


    .submit-btn:active {
        transform:
            translateY(0);
    }


    .submit-btn:disabled {
        background: #475569;

        box-shadow: none;

        cursor: not-allowed;

        transform: none;
    }


    /* =========================================================
       ALERTS
    ========================================================= */

    .alert {

        width: 100%;

        padding:
            13px
            16px;

        margin-bottom: 24px;

        display: none;

        border-radius:
            var(--radius-md);

        font-size:
            clamp(12px, 2vw, 14px);

        line-height: 1.5;

        backdrop-filter: blur(10px);

        overflow-wrap: anywhere;
    }


    .alert-error {
        background:
            rgba(239, 68, 68, 0.20);

        color: #fca5a5;

        border:
            1px solid
            rgba(239, 68, 68, 0.40);
    }


    .alert-success {
        background:
            rgba(34, 197, 94, 0.20);

        color: #86efac;

        border:
            1px solid
            rgba(34, 197, 94, 0.40);
    }


    /* =========================================================
       FLATPICKR CALENDAR
    ========================================================= */

    .flatpickr-calendar {

        width: min(
            340px,
            calc(100vw - 20px)
        ) !important;

        max-width:
            calc(100vw - 20px) !important;

        padding: 14px !important;

        background:
            #0f172a !important;

        border: none !important;

        border-radius:
            18px !important;

        box-shadow:
            0 25px 50px -12px
            rgba(0, 0, 0, 0.70),
            0 0 0 1px
            rgba(255, 255, 255, 0.15)
            !important;

        font-family: inherit !important;
    }


    /* =========================================================
       FLATPICKR MONTH
    ========================================================= */

    .flatpickr-months {

        display: flex !important;

        align-items: center !important;

        height: 38px !important;

        margin-bottom: 5px !important;
    }


    .flatpickr-months .flatpickr-month {

        height: 100% !important;

        color: #ffffff !important;
    }


    .flatpickr-current-month {

        display: flex !important;

        align-items: center !important;

        justify-content: center !important;

        padding: 0 !important;

        color: #ffffff !important;

        font-size: 15px !important;

        font-weight: 700 !important;
    }


    .flatpickr-current-month select {

        padding:
            4px
            8px !important;

        color: #ffffff !important;

        background:
            rgba(255, 255, 255, 0.10)
            !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.20)
            !important;

        border-radius:
            8px !important;

        font-size:
            13px !important;
    }


    .flatpickr-months .flatpickr-prev-month,
    .flatpickr-months .flatpickr-next-month {

        width: 32px !important;
        height: 32px !important;

        padding: 8px !important;

        top: 3px !important;

        display: flex !important;

        align-items: center !important;
        justify-content: center !important;

        border-radius:
            8px !important;

        background:
            rgba(255, 255, 255, 0.08)
            !important;
    }


    .flatpickr-months .flatpickr-prev-month svg,
    .flatpickr-months .flatpickr-next-month svg {

        width: 12px !important;
        height: 12px !important;

        fill: #60a5fa !important;
    }



   /* =========================================================
   FLATPICKR WEEKDAY HEADER - FIXED
========================================================= */

.flatpickr-weekdays {
    width: 100% !important;

    display: grid !important;
    grid-template-columns: repeat(7, minmax(0, 1fr)) !important;

    align-items: center !important;

    height: 32px !important;

    margin: 0 0 6px 0 !important;

    padding: 0 !important;

    background: transparent !important;
}


.flatpickr-weekdaycontainer {
    width: 100% !important;

    display: grid !important;
    grid-template-columns: repeat(7, minmax(0, 1fr)) !important;

    align-items: center !important;

    margin: 0 !important;
    padding: 0 !important;
}


span.flatpickr-weekday {
    width: 100% !important;
    max-width: none !important;

    display: flex !important;

    align-items: center !important;
    justify-content: center !important;

    margin: 0 !important;
    padding: 0 !important;

    color: #94a3b8 !important;

    font-size: 10px !important;

    font-weight: 700 !important;

    line-height: 1 !important;

    text-align: center !important;

    text-transform: uppercase !important;

    letter-spacing: 0 !important;

    white-space: nowrap !important;

    overflow: hidden !important;
}


    /* =========================================================
       FLATPICKR DAYS
    ========================================================= */

    .flatpickr-days {

        width: 100% !important;
    }


    .dayContainer {

        width: 100% !important;

        min-width: 100% !important;

        max-width: 100% !important;

        display: grid !important;

        grid-template-columns:
            repeat(7, minmax(0, 1fr))
            !important;

        gap: 4px 2px !important;

        .flatpickr-days {
    width: 100% !important;
}

.flatpickr-innerContainer {
    width: 100% !important;
}

.calendarContainer {
    width: 100% !important;
}
    }


    .flatpickr-day {

        width: min(
            36px,
            100%
        ) !important;

        max-width: 36px !important;

        height: 36px !important;

        margin: auto !important;

        line-height: 36px !important;

        color: #cbd5e1 !important;

        border:
            1px solid
            transparent !important;

        border-radius:
            10px !important;

        font-size:
            13px !important;

        font-weight: 500 !important;

        transition:
            background 0.15s ease,
            color 0.15s ease !important;
    }


    .flatpickr-day:hover {

        color: #ffffff !important;

        background:
            rgba(255, 255, 255, 0.12)
            !important;
    }


    .flatpickr-day.selected {

        color: #ffffff !important;

        background:
            #2563eb !important;

        border-color:
            #3b82f6 !important;

        font-weight: 700 !important;

        box-shadow:
            0 0 10px
            rgba(37, 99, 235, 0.60)
            !important;
    }


    .flatpickr-day.flatpickr-disabled,
    .flatpickr-day.flatpickr-disabled:hover {

        color:
            rgba(255, 255, 255, 0.18)
            !important;

        background:
            transparent !important;
    }


    /* =========================================================
       FLATPICKR TIME
    ========================================================= */

    .flatpickr-time {

        min-height: 48px !important;

        height: 48px !important;

        margin-top: 8px !important;

        padding:
            4px
            8px !important;

        display: flex !important;

        align-items: center !important;

        justify-content: center !important;

        gap: 5px !important;

        background:
            rgba(255, 255, 255, 0.05)
            !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.12)
            !important;

        border-radius:
            12px !important;
    }


    .flatpickr-time input {

        width: auto !important;

        height: 34px !important;

        padding: 0 !important;

        color: #ffffff !important;

        background:
            rgba(255, 255, 255, 0.08)
            !important;

        border:
            1px solid
            rgba(255, 255, 255, 0.10)
            !important;

        border-radius:
            8px !important;

        font-size:
            14px !important;

        font-weight: 700 !important;
    }


    .flatpickr-time input:focus {

        border-color:
            #60a5fa !important;

        background:
            rgba(255, 255, 255, 0.16)
            !important;
    }


    .flatpickr-time .flatpickr-time-separator {

        color:
            #94a3b8 !important;

        font-weight: 700 !important;
    }


    .flatpickr-time .flatpickr-am-pm {

        height: 34px !important;

        padding:
            0
            12px !important;

        color: #ffffff !important;

        background:
            #2563eb !important;

        border-radius:
            8px !important;

        font-size:
            12px !important;

        font-weight: 700 !important;

        line-height: 34px !important;

        cursor: pointer !important;
    }


    /* =========================================================
       TABLET
       768px → 1023px
    ========================================================= */

    @media (max-width: 1023px) {

        .navbar {
            padding-left: 24px;
            padding-right: 24px;
        }

        .main-container {
            max-width: 760px;
        }

        .glass-card {
            padding:
                30px
                28px;
        }
    }


    /* =========================================================
       MOBILE
       Below 768px
    ========================================================= */

    @media (max-width: 767px) {

        body {

            background-attachment:
                scroll;
        }


        .navbar {

            padding:
                12px
                14px;

            gap: 10px;
        }


        .navbar-brand {

            gap: 10px;
        }


        .college-logo {

            height: 40px;

            max-width: 90px;
        }


        .brand-text h1 {

            font-size:
                clamp(
                    12px,
                    3.5vw,
                    15px
                );

            white-space:
                normal;

            line-height: 1.2;
        }


        .brand-text p {

            font-size: 9px;
        }


        .navbar-actions {

            gap: 7px;
        }


        .naac-badge {

            height: 34px;

            max-width: 65px;

            padding:
                2px 5px;
        }


        .admin-link {

            min-height: 36px;

            padding:
                7px 10px;

            font-size: 11px;
        }


        .main-container {

            margin:
                20px auto 28px;

            padding:
                0 12px;
        }


        .glass-card {

            padding:
                22px
                16px;

            border-radius:
                17px;
        }


        .card-header {

            margin-bottom:
                22px;

            padding-bottom:
                14px;
        }


        .form-grid {

            grid-template-columns:
                1fr;

            gap: 16px;

            margin-bottom:
                16px;
        }


        .form-group-full {

            margin-bottom:
                16px;
        }


        input[type="text"],
        input[type="email"],
        select,
        textarea,
        .flatpickr-input,
        .flatpickr-input.form-control {

            min-height:
                50px;

            padding:
                13px
                14px !important;

            font-size:
                16px !important;
        }


        textarea {

            min-height:
                105px;
        }


        .submit-btn {

            min-height:
                54px;

            font-size:
                14px;
        }


        .flatpickr-calendar {

            width:
                calc(100vw - 20px)
                !important;

            max-width:
                calc(100vw - 20px)
                !important;

            padding:
                10px !important;

            border-radius:
                15px !important;
        }


        .flatpickr-day {

            height:
                34px !important;

            line-height:
                34px !important;

            font-size:
                12px !important;
        }


        .flatpickr-time {

            height:
                46px !important;

            min-height:
                46px !important;
        }
    }


    /* =========================================================
       SMALL MOBILE
       375px and below
    ========================================================= */

    @media (max-width: 375px) {

        .navbar {

            align-items:
                center;

            padding:
                10px;
        }


        .college-logo {

            height:
                34px;

            max-width:
                70px;
        }


        .brand-text h1 {

            font-size:
                11px;
        }


        .brand-text p {

            display:
                none;
        }


        .naac-badge {

            display:
                none;
        }


        .admin-link {

            padding:
                6px 8px;

            font-size:
                10px;
        }


        .main-container {

            margin-top:
                14px;

            padding:
                0 8px;
        }


        .glass-card {

            padding:
                18px 12px;

            border-radius:
                15px;
        }


        .card-header h2 {

            font-size:
                18px;
        }


        .card-header p {

            font-size:
                11px;
        }


        .flatpickr-calendar {

            width:
                calc(100vw - 16px)
                !important;

            max-width:
                calc(100vw - 16px)
                !important;
        }


        .flatpickr-day {

            height:
                32px !important;

            line-height:
                32px !important;

            font-size:
                11px !important;
        }


        .flatpickr-time .flatpickr-am-pm {

            padding:
                0 8px !important;
        }
    }


    /* =========================================================
       VERY SMALL DEVICES
       320px and below
    ========================================================= */

    @media (max-width: 330px) {

        .navbar {

            flex-wrap:
                wrap;
        }


        .navbar-brand {

            width:
                100%;
        }


        .navbar-actions {

            width:
                100%;

            justify-content:
                flex-end;
        }


        .main-container {

            padding:
                0 6px;
        }


        .glass-card {

            padding:
                16px 10px;
        }


        .flatpickr-calendar {

            width:
                calc(100vw - 12px)
                !important;

            max-width:
                calc(100vw - 12px)
                !important;
        }
    }


    /* =========================================================
       LARGE DESKTOP
       1440px+
    ========================================================= */

    @media (min-width: 1440px) {

        .main-container {

            max-width:
                850px;
        }


        .glass-card {

            padding:
                42px
                48px;
        }
    }


    /* =========================================================
       ACCESSIBILITY
    ========================================================= */

    :focus-visible {

        outline:
            2px solid
            #60a5fa;

        outline-offset:
            3px;
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

        html {

            scroll-behavior:
                auto;
        }


        *,
        *::before,
        *::after {

            transition:
                none !important;

            animation:
                none !important;
        }
    }
</style>
</head>

<body>

    <header class="navbar">
        <div class="navbar-brand">
            <img src="college-logo.png" alt="College Logo" class="college-logo" onerror="this.style.display='none'">
            <div class="brand-text">
                <h1>Campus Venue Reservation</h1>
                <p>Institutional Slot Booking Portal</p>
            </div>
        </div>

        <!-- Right Side Actions: NAAC Badge + Admin Button -->
        <div class="navbar-actions">
            <img src="naac-logo.png" alt="NAAC A++ Accredited" class="naac-badge" title="NAAC A++ Accredited"
                onerror="this.style.display='none'">
            <a href="admin.html" class="admin-link">Admin Portal &rarr;</a>
        </div>
    </header>

    <main class="main-container">
        <div class="glass-card">
            <div class="card-header">
                <h2>Reserve a Venue</h2>
                <p>Select venue and timing. Collision detection prevents overlapping bookings.</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="bookingForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="faculty_name">Faculty Name</label>
                        <input type="text" id="faculty_name" placeholder="Prof. Alan Turing" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Official Mail ID</label>
                        <input type="email" id="email" placeholder="faculty@institution.edu" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="venue">Booking Venue</label>
                        <select id="venue" required>
                            <option value="Seminar Hall">Seminar Hall</option>
                            <option value="Placement Hall">Placement Hall</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" placeholder="e.g. MCA, CSE, ECE" required>
                    </div>
                </div>

                <div class="form-group-full">
                    <label for="event_details">Event Details / Purpose</label>
                    <textarea id="event_details"
                        placeholder="Guest lecture topic, speaker name, or placement drive details..."
                        required></textarea>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="start_datetime">Event Start Date &amp; Time</label>
                        <input type="text" id="start_datetime" placeholder="Select start time" required>
                    </div>
                    <div class="form-group">
                        <label for="end_datetime">Event End Date &amp; Time</label>
                        <input type="text" id="end_datetime" placeholder="Select end time" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Confirm and Book Slot</button>
            </form>
        </div>
    </main>

    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        const API_BASE = "/api/v1";

        const fpConfig = {
            enableTime: true,
            dateFormat: "Y-m-dTH:i:S",
            altInput: true,
            altFormat: "d-m-Y h:i K",
            time_24hr: false,
            minuteIncrement: 15,
            minDate: "today"
        };

        flatpickr("#start_datetime", fpConfig);
        flatpickr("#end_datetime", fpConfig);

        const form = document.getElementById("bookingForm");
        const alertBox = document.getElementById("alertBox");
        const submitBtn = document.getElementById("submitBtn");

        function showAlert(message, isError = false) {
            alertBox.style.display = "block";
            alertBox.className = "alert " + (isError ? "alert-error" : "alert-success");
            alertBox.innerText = message;
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            alertBox.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.innerText = "Checking availability...";

            const startVal = document.getElementById("start_datetime").value;
            const endVal = document.getElementById("end_datetime").value;

            if (!startVal || !endVal) {
                showAlert("Please select both start and end dates/times.", true);
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
                return;
            }

            const startDateObj = new Date(startVal);
            const endDateObj = new Date(endVal);

            if (endDateObj <= startDateObj) {
                showAlert("Event end time must be after the start time.", true);
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
                return;
            }

            const payload = {
                faculty_name: document.getElementById("faculty_name").value.trim(),
                email: document.getElementById("email").value.trim(),
                venue: document.getElementById("venue").value,
                department: document.getElementById("department").value.trim(),
                event_details: document.getElementById("event_details").value.trim(),
                start_datetime: startVal,
                end_datetime: endVal
            };

            try {
                const res = await fetch(`${API_BASE}/bookings`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) {
                    let errorMsg = "Unable to reserve slot.";
                    if (typeof data.detail === "string") {
                        errorMsg = data.detail;
                    } else if (Array.isArray(data.detail) && data.detail.length > 0) {
                        errorMsg = data.detail.map(err => `${err.loc ? err.loc.slice(-1)[0] + ': ' : ''}${err.msg}`).join(", ");
                    }
                    throw new Error(errorMsg);
                }

                showAlert(`Booking Confirmed! Reference ID: ${data.booking_reference}. A confirmation email has been dispatched.`);
                form.reset();
            } catch (err) {
                showAlert(err.message || "Network error: Unable to connect to server.", true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
            }
        });
    </script>
</body>

</html>
