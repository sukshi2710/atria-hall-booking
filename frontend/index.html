<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Venue Reservation Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Flatpickr Core CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-card: rgba(15, 23, 42, 0.65);
            /* Deep frosted glass */
            --text-light: #ffffff;
            --text-dim: #cbd5e1;
            --radius-lg: 20px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* Clean gradient that highlights the campus image without darkening it too heavily */
            background:
                radial-gradient(circle at center, rgba(15, 23, 42, 0.45) 0%, rgba(15, 23, 42, 0.85) 100%),
                url('college-bg.jpeg') no-repeat center center fixed;
            background-size: cover;
            background-position: center top;
            /* Keeps campus architecture properly framed */
            color: var(--text-light);
            -webkit-font-smoothing: antialiased;
        }

        /* Slimmer, well-centered card container so more campus background shows around it */
        .main-container {
            max-width: 680px;
            /* Reduced from 820px to expose more background */
            margin: 30px auto 40px auto;
            padding: 0 16px;
            width: 100%;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.72);
            /* Translucent frosted glass */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
            padding: 30px 34px;
        }

        /* Glassmorphic Navigation Bar */
        .navbar {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--glass-border);
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .college-logo {
            height: 44px;
            width: auto;
            max-width: 140px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .brand-text h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.3px;
            color: #ffffff;
        }

        .brand-text p {
            font-size: 12px;
            color: #93c5fd;
            font-weight: 500;
        }

        /* Container for right-side items */
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* NAAC A++ Badge Styling */
        .naac-badge {
            height: 40px;
            width: auto;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.1);
            padding: 3px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .naac-badge:hover {
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .admin-link {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid var(--glass-border);
            padding: 8px 18px;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .admin-link:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* Main Glass Container */
        .main-container {
            max-width: 820px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .glass-card {
            background: var(--glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 38px 44px;
        }

        .card-header {
            margin-bottom: 26px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 16px;
        }

        .card-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .card-header p {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* Form Grid */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group-full {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: #93c5fd;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        /* Frosted Input Fields */
        input[type="text"],
        input[type="email"],
        select,
        textarea,
        .flatpickr-input,
        .flatpickr-input.form-control {
            width: 100% !important;
            padding: 12px 16px !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: var(--radius-md) !important;
            font-size: 14px !important;
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.08) !important;
            backdrop-filter: blur(6px) !important;
            outline: none !important;
            transition: all 0.2s ease !important;
        }

        /* Placeholder Colors */
        ::placeholder {
            color: rgba(203, 213, 225, 0.6) !important;
        }

        select option {
            background-color: #0f172a;
            color: #ffffff;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus,
        .flatpickr-input:focus,
        .flatpickr-input.form-control:focus {
            border-color: #60a5fa !important;
            background: rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.25) !important;
        }

        textarea {
            resize: vertical;
            min-height: 85px;
        }

        /* Glass Glow Action Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Alerts */
        .alert {
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 24px;
            display: none;
            line-height: 1.5;
            backdrop-filter: blur(10px);
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        /* Modern Flatpickr Popup */
        /* --- Modern Spaced Flatpickr Calendar --- */
        .flatpickr-calendar {
            font-family: inherit !important;
            background: #0f172a !important;
            border-radius: 18px !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.15) !important;
            border: none !important;
            padding: 16px !important;
            width: 340px !important;
            height: auto !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 10px !important;
        }

        /* Month Header */
        .flatpickr-months {
            display: flex !important;
            align-items: center !important;
            height: 38px !important;
            position: relative !important;
            margin-bottom: 4px !important;
        }

        .flatpickr-months .flatpickr-month {
            height: 100% !important;
            color: #ffffff !important;
        }

        .flatpickr-current-month {
            font-size: 15px !important;
            font-weight: 700 !important;
            color: #ffffff !important;
            padding: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .flatpickr-current-month select {
            background: rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 8px !important;
            padding: 4px 8px !important;
            font-size: 13px !important;
            font-weight: 600 !important;
            outline: none !important;
        }

        .flatpickr-months .flatpickr-prev-month,
        .flatpickr-months .flatpickr-next-month {
            padding: 8px !important;
            height: 32px !important;
            width: 32px !important;
            border-radius: 8px !important;
            background: rgba(255, 255, 255, 0.08) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            top: 3px !important;
        }

        .flatpickr-months .flatpickr-prev-month svg,
        .flatpickr-months .flatpickr-next-month svg {
            fill: #60a5fa !important;
            width: 12px !important;
            height: 12px !important;
        }

        /* Weekday Labels */
        .flatpickr-weekdays {
            height: 28px !important;
            margin-bottom: 4px !important;
        }

        span.flatpickr-weekday {
            color: #94a3b8 !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.5px !important;
        }

        /* Days Container & Date Chips */
        .flatpickr-days {
            width: 100% !important;
        }

        .dayContainer {
            width: 100% !important;
            min-width: 100% !important;
            max-width: 100% !important;
            display: grid !important;
            grid-template-columns: repeat(7, 1fr) !important;
            row-gap: 4px !important;
            column-gap: 2px !important;
        }

        .flatpickr-day {
            color: #cbd5e1 !important;
            border-radius: 10px !important;
            height: 36px !important;
            width: 36px !important;
            max-width: 36px !important;
            line-height: 36px !important;
            margin: auto !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            border: 1px solid transparent !important;
            transition: all 0.15s ease !important;
        }

        .flatpickr-day:hover {
            background: rgba(255, 255, 255, 0.12) !important;
            color: #ffffff !important;
        }

        .flatpickr-day.selected {
            background: #2563eb !important;
            border-color: #3b82f6 !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.6) !important;
        }

        .flatpickr-day.flatpickr-disabled,
        .flatpickr-day.flatpickr-disabled:hover {
            color: rgba(255, 255, 255, 0.18) !important;
            background: transparent !important;
        }

        /* Time Picker with Rounded Surfaces */
        .flatpickr-time {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 12px !important;
            height: 48px !important;
            line-height: 48px !important;
            margin-top: 8px !important;
            padding: 4px 8px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 6px !important;
        }

        .flatpickr-time input {
            color: #ffffff !important;
            font-size: 15px !important;
            font-weight: 700 !important;
            border-radius: 8px !important;
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            height: 34px !important;
            padding: 0 !important;
        }

        .flatpickr-time input:focus {
            border-color: #60a5fa !important;
            background: rgba(255, 255, 255, 0.16) !important;
        }

        .flatpickr-time .flatpickr-time-separator {
            color: #94a3b8 !important;
            font-weight: 700 !important;
        }

        .flatpickr-time .flatpickr-am-pm {
            color: #ffffff !important;
            background: #2563eb !important;
            border-radius: 8px !important;
            font-size: 13px !important;
            font-weight: 700 !important;
            height: 34px !important;
            line-height: 34px !important;
            padding: 0 14px !important;
            cursor: pointer !important;
            transition: background 0.15s ease !important;
        }

        .flatpickr-time .flatpickr-am-pm:hover {
            background: #1d4ed8 !important;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="navbar-brand">
            <img src="college-logo.png" alt="College Logo" class="college-logo" onerror="this.style.display='none'">
            <div class="brand-text">
                <h1>Campus Venue Reservation</h1>
                <p>Institutional Slot Booking Portal</p>
            </div>
        </div>

        <!-- Right Side Actions: NAAC Badge + Admin Button -->
        <div class="navbar-actions">
            <img src="naac-logo.png" alt="NAAC A++ Accredited" class="naac-badge" title="NAAC A++ Accredited"
                onerror="this.style.display='none'">
            <a href="admin.html" class="admin-link">Admin Portal &rarr;</a>
        </div>
    </header>

    <main class="main-container">
        <div class="glass-card">
            <div class="card-header">
                <h2>Reserve a Venue</h2>
                <p>Select venue and timing. Collision detection prevents overlapping bookings.</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="bookingForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="faculty_name">Faculty Name</label>
                        <input type="text" id="faculty_name" placeholder="Prof. Alan Turing" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Official Mail ID</label>
                        <input type="email" id="email" placeholder="faculty@institution.edu" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="venue">Booking Venue</label>
                        <select id="venue" required>
                            <option value="Seminar Hall">Seminar Hall</option>
                            <option value="Placement Hall">Placement Hall</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" placeholder="e.g. MCA, CSE, ECE" required>
                    </div>
                </div>

                <div class="form-group-full">
                    <label for="event_details">Event Details / Purpose</label>
                    <textarea id="event_details"
                        placeholder="Guest lecture topic, speaker name, or placement drive details..."
                        required></textarea>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="start_datetime">Event Start Date &amp; Time</label>
                        <input type="text" id="start_datetime" placeholder="Select start time" required>
                    </div>
                    <div class="form-group">
                        <label for="end_datetime">Event End Date &amp; Time</label>
                        <input type="text" id="end_datetime" placeholder="Select end time" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Confirm and Book Slot</button>
            </form>
        </div>
    </main>

    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        const API_BASE = "/api/v1";

        const fpConfig = {
            enableTime: true,
            dateFormat: "Y-m-dTH:i:S",
            altInput: true,
            altFormat: "d-m-Y h:i K",
            time_24hr: false,
            minuteIncrement: 15,
            minDate: "today"
        };

        flatpickr("#start_datetime", fpConfig);
        flatpickr("#end_datetime", fpConfig);

        const form = document.getElementById("bookingForm");
        const alertBox = document.getElementById("alertBox");
        const submitBtn = document.getElementById("submitBtn");

        function showAlert(message, isError = false) {
            alertBox.style.display = "block";
            alertBox.className = "alert " + (isError ? "alert-error" : "alert-success");
            alertBox.innerText = message;
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            alertBox.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.innerText = "Checking availability...";

            const startVal = document.getElementById("start_datetime").value;
            const endVal = document.getElementById("end_datetime").value;

            if (!startVal || !endVal) {
                showAlert("Please select both start and end dates/times.", true);
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
                return;
            }

            const startDateObj = new Date(startVal);
            const endDateObj = new Date(endVal);

            if (endDateObj <= startDateObj) {
                showAlert("Event end time must be after the start time.", true);
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
                return;
            }

            const payload = {
                faculty_name: document.getElementById("faculty_name").value.trim(),
                email: document.getElementById("email").value.trim(),
                venue: document.getElementById("venue").value,
                department: document.getElementById("department").value.trim(),
                event_details: document.getElementById("event_details").value.trim(),
                start_datetime: startVal,
                end_datetime: endVal
            };

            try {
                const res = await fetch(`${API_BASE}/bookings`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) {
                    let errorMsg = "Unable to reserve slot.";
                    if (typeof data.detail === "string") {
                        errorMsg = data.detail;
                    } else if (Array.isArray(data.detail) && data.detail.length > 0) {
                        errorMsg = data.detail.map(err => `${err.loc ? err.loc.slice(-1)[0] + ': ' : ''}${err.msg}`).join(", ");
                    }
                    throw new Error(errorMsg);
                }

                showAlert(`Booking Confirmed! Reference ID: ${data.booking_reference}. A confirmation email has been dispatched.`);
                form.reset();
            } catch (err) {
                showAlert(err.message || "Network error: Unable to connect to server.", true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm and Book Slot";
            }
        });
    </script>
</body>

</html>
